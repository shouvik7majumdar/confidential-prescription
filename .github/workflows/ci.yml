name: CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Compact CLI
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Compact Compiler
        run: |
          $HOME/.local/bin/compact update 0.31.1

      - name: Verify Compact Installation
        run: |
          $HOME/.local/bin/compact --version
          $HOME/.local/bin/compact compile --version

      - name: Install Project Dependencies
        run: npm ci

      - name: Compile Compact Contracts
        run: |
          $HOME/.local/bin/compact compile contracts/prescription-verifier.compact contracts/managed/prescription-verifier

      - name: Verify Generated Contract Artifacts
        run: |
          test -f contracts/managed/prescription-verifier/contract/index.js
          test -f contracts/managed/prescription-verifier/contract/index.d.ts
          echo "✅ Managed contract artifacts verified successfully."

      - name: Run Tests
        run: npm test

      - name: Setup Node.js for UI
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install UI Dependencies
        run: |
          cd ui
          npm ci

      - name: Build Frontend (UI)
        env:
          VITE_NETWORK: preview
          VITE_CONTRACT_ADDRESS: 54b40b55db6c344ddb1511d13c93e2bbbb280b4c1738b912cd838f5ac94df8dc
          VITE_PROOF_SERVER_URL: https://proof-server.preview.midnight.network
          VITE_INDEXER_URL: https://indexer.preview.midnight.network/api/v4/graphql
          VITE_INDEXER_WS_URL: wss://indexer.preview.midnight.network/api/v4/graphql/ws
        run: |
          cd ui
          npm run build
          echo "✅ UI built successfully."